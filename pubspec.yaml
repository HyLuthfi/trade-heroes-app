name: kursus_saham
description: "Trade Heroes: A gamified Indonesian stock market education platform built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  path_provider: ^2.1.2
  video_player: ^2.8.2
  shared_preferences: ^2.3.0
  supabase_flutter: ^2.8.0
  image_picker: ^1.1.2
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/audio/themes/default/
    - assets/audio/themes/minimal/
    - assets/audio/themes/arcade/
    - assets/audio/themes/nature/
    - assets/audio/themes/mechanical/
    - assets/audio/themes/bubble/
    - assets/Flash_Screen.mp4
