<body style="background-color: #0b0f19; margin: 0; padding: 0;">
  <script>
    // Early OAuth redirect detection before Supabase strips URL hash
    try {
      if (window.location.hash.indexOf('access_token') !== -1 || window.location.search.indexOf('code=') !== -1) {
        sessionStorage.setItem('th_oauth_pending', '1');
      }
    } catch(e) {}

    // Invalidate old service worker and caches to ensure latest release is loaded
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var i = 0; i < names.length; i++) {
          caches.delete(names[i]);
        }
      });
    }

    // High-Performance Zero-Latency Web Audio Engine
    (function() {
      let audioCtx = null;
      let audioMuted = false;
      let bgmAudio = null;

      function getAudioContext() {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            audioCtx = new AudioContext();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      // Auto-unlock Web Audio on any user gesture
      ['click', 'pointerdown', 'keydown', 'touchstart'].forEach(function(evt) {
        window.addEventListener(evt, function() {
          getAudioContext();
        }, { once: false, passive: true });
      });

      const soundBuffers = {};
      let currentTheme = 'default';
      const soundNames = ['click', 'correct', 'wrong', 'reward', 'trade'];

      function getSoundUrl(name, theme) {
        if (!theme || theme === 'default') {
          return '/assets/assets/audio/' + name + '.mp3';
        }
        return '/assets/assets/audio/themes/' + theme + '/' + name + '.mp3';
      }

      function preloadSounds() {
        soundNames.forEach(function(name) {
          const url = getSoundUrl(name, currentTheme);
          fetch(url)
            .then(function(res) { return res.arrayBuffer(); })
            .then(function(buf) {
              const ctx = getAudioContext();
              if (ctx) {
                return ctx.decodeAudioData(buf);
              }
            })
            .then(function(decoded) {
              if (decoded) soundBuffers[name] = decoded;
            })
            .catch(function() {});
        });
      }

      window.addEventListener('load', function() {
        preloadSounds();
        // Pre-cache all theme buffers
        ['default','minimal','arcade','nature','mechanical','bubble'].forEach(preloadThemeBuffers);
      });
      setTimeout(preloadSounds, 300);

      let lastClickTime = 0;

      function playSynthClick(vol) {
        if (audioMuted) return;
        const nowMs = performance.now();
        if (nowMs - lastClickTime < 70) return;
        lastClickTime = nowMs;

        const ctx = getAudioContext();
        if (!ctx) return;
        try {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const now = ctx.currentTime;
          osc.type = 'sine';
          // Soft water droplet / gentle bubble (680Hz -> 320Hz)
          osc.frequency.setValueAtTime(680, now);
          osc.frequency.exponentialRampToValueAtTime(320, now + 0.045);
          gain.gain.setValueAtTime((vol || 0.3) * 0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.055);
        } catch (e) {}
      }

      // Universal click feedback: REMOVED — only meaningful actions get SFX

      function playSoundImpl(name, volume) {
        if (audioMuted) return;
        const ctx = getAudioContext();
        const vol = typeof volume === 'number' ? volume : 0.7;

        // Support "theme/sound" format: e.g. "bubble/click", "arcade/correct"
        let theme = currentTheme;
        let soundName = name;
        if (name.indexOf('/') !== -1) {
          const parts = name.split('/');
          theme = parts[0];
          soundName = parts[1];
        }

        const bufKey = getBufferKey(theme, soundName);

        // Try themed buffer first
        if (themedBuffers[bufKey] && ctx) {
          try {
            const src = ctx.createBufferSource();
            const gain = ctx.createGain();
            src.buffer = themedBuffers[bufKey];
            gain.gain.value = Math.min(vol, 0.6);
            src.connect(gain);
            gain.connect(ctx.destination);
            src.start(0);
            return;
          } catch (e) {}
        }

        // Try legacy default buffer (for backward compat)
        if (soundBuffers[soundName] && ctx) {
          try {
            const src = ctx.createBufferSource();
            const gain = ctx.createGain();
            src.buffer = soundBuffers[soundName];
            gain.gain.value = Math.min(vol, 0.6);
            src.connect(gain);
            gain.connect(ctx.destination);
            src.start(0);
            return;
          } catch (e) {}
        }

        // HTML5 Audio fallback
        try {
          const url = getSoundUrl(soundName, theme);
          const audio = new Audio(url);
          audio.volume = Math.min(0.5, Math.max(0.0, vol));
          audio.play().catch(function() {});
        } catch (e) {}
      }

      let currentBgmTrack = 'default';

      function getBgmUrl(track) {
        if (!track || track === 'default') {
          return '/assets/assets/audio/bgm.mp3';
        }
        return '/assets/assets/audio/bgm/' + track + '.mp3';
      }

      function startBgmImpl(volume) {
        if (audioMuted) return;
        try {
          const url = getBgmUrl(currentBgmTrack);
          if (bgmAudio && bgmAudio._trackUrl !== url) {
            bgmAudio.pause();
            bgmAudio = null;
          }
          if (!bgmAudio) {
            bgmAudio = new Audio(url);
            bgmAudio.loop = true;
            bgmAudio._trackUrl = url;
          }
          bgmAudio.volume = typeof volume === 'number' ? volume : 0.14;
          bgmAudio.play().catch(function() {});
        } catch (e) {}
      }

      function stopBgmImpl() {
        try {
          if (bgmAudio) {
            bgmAudio.pause();
            bgmAudio.currentTime = 0;
          }
        } catch (e) {}
      }

      function setAudioMutedImpl(muted) {
        audioMuted = muted;
        if (muted && bgmAudio) {
          bgmAudio.pause();
        }
      }

      // Theme-keyed buffer cache: { "arcade:click": AudioBuffer, ... }
      const themedBuffers = {};

      function getBufferKey(theme, name) {
        return (theme || 'default') + ':' + name;
      }

      function setAudioThemeImpl(theme) {
        currentTheme = theme || 'default';
        // Preload new theme buffers in background (don't clear old ones)
        preloadThemeBuffers(currentTheme);
      }

      function preloadThemeBuffers(theme) {
        const ctx = getAudioContext();
        if (!ctx) return;
        soundNames.forEach(function(name) {
          const key = getBufferKey(theme, name);
          if (themedBuffers[key]) return; // already cached
          const url = getSoundUrl(name, theme);
          fetch(url)
            .then(function(res) { return res.arrayBuffer(); })
            .then(function(buf) { return ctx.decodeAudioData(buf); })
            .then(function(decoded) { if (decoded) themedBuffers[key] = decoded; })
            .catch(function() {});
        });
      }

      function setBgmTrackImpl(track) {
        currentBgmTrack = track || 'default';
      }

      // Expose globally across window, globalThis and dotted properties
      window.playTradeSound = globalThis.playTradeSound = window['window.playTradeSound'] = playSoundImpl;
      window.startTradeBgm = globalThis.startTradeBgm = window['window.startTradeBgm'] = startBgmImpl;
      window.stopTradeBgm = globalThis.stopTradeBgm = window['window.stopTradeBgm'] = stopBgmImpl;
      window.setTradeAudioMuted = globalThis.setTradeAudioMuted = window['window.setTradeAudioMuted'] = setAudioMutedImpl;
      window.setTradeAudioTheme = globalThis.setTradeAudioTheme = window['window.setTradeAudioTheme'] = setAudioThemeImpl;
      window.setTradeBgmTrack = globalThis.setTradeBgmTrack = window['window.setTradeBgmTrack'] = setBgmTrackImpl;

      // === LIVE VOICE & GEMINI AUDIO STREAMING ENGINE ===
      let activeVoiceAudio = null;
      let voiceRecognition = null;
      let liveVoiceAudioQueue = [];
      let isPlayingVoiceQueue = false;
      let activeVoiceStreamAbort = null;
      let isVoiceStreamDone = false;
      let onVoiceStreamAllEndedCb = null;

      function dataUriToBlob(dataUri) {
        try {
          const parts = dataUri.split(',');
          const mimeMatch = parts[0].match(/:(.*?);/);
          const mime = mimeMatch ? mimeMatch[1] : 'audio/wav';
          const binary = atob(parts[1]);
          const len = binary.length;
          const u8arr = new Uint8Array(len);
          for (let i = 0; i < len; i++) {
            u8arr[i] = binary.charCodeAt(i);
          }
          return new Blob([u8arr], { type: mime });
        } catch(e) {
          console.warn('[LiveVoice] dataUriToBlob failed:', e);
          return null;
        }
      }

      function playNextVoiceQueueChunk() {
        if (liveVoiceAudioQueue.length === 0) {
          isPlayingVoiceQueue = false;
          activeVoiceAudio = null;
          if (isVoiceStreamDone && typeof onVoiceStreamAllEndedCb === 'function') {
            const cb = onVoiceStreamAllEndedCb;
            onVoiceStreamAllEndedCb = null;
            try { cb(); } catch(e) { console.warn("[LiveVoice] allEnded cb err:", e); }
          }
          return;
        }

        isPlayingVoiceQueue = true;
        const nextUri = liveVoiceAudioQueue.shift();

        let playUrl = nextUri;
        const blob = dataUriToBlob(nextUri);
        if (blob) {
          playUrl = URL.createObjectURL(blob);
        }

        activeVoiceAudio = new Audio(playUrl);

        activeVoiceAudio.onended = function() {
          if (playUrl.startsWith('blob:')) URL.revokeObjectURL(playUrl);
          playNextVoiceQueueChunk();
        };

        activeVoiceAudio.onerror = function(err) {
          console.warn('[LiveVoice] chunk audio error:', err);
          if (playUrl.startsWith('blob:')) URL.revokeObjectURL(playUrl);
          playNextVoiceQueueChunk();
        };

        const playPromise = activeVoiceAudio.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(function(e) {
            console.warn('[LiveVoice] chunk play error:', e);
            if (playUrl.startsWith('blob:')) URL.revokeObjectURL(playUrl);
            playNextVoiceQueueChunk();
          });
        }
      }

      window.enqueueLiveVoiceAudio = globalThis.enqueueLiveVoiceAudio = function(dataUri, onStarted, onAllEnded) {
        if (typeof onAllEnded === 'function') {
          onVoiceStreamAllEndedCb = onAllEnded;
        }
        liveVoiceAudioQueue.push(dataUri);
        if (!isPlayingVoiceQueue) {
          if (typeof onStarted === 'function') {
            try { onStarted(); } catch(e) { console.warn("[LiveVoice] onStarted err:", e); }
          }
          playNextVoiceQueueChunk();
        }
      };

      window.playVoiceAudioUri = globalThis.playVoiceAudioUri = function(dataUri, onEnded) {
        window.stopVoiceAudio();
        let playUrl = dataUri;
        const blob = dataUriToBlob(dataUri);
        if (blob) playUrl = URL.createObjectURL(blob);

        activeVoiceAudio = new Audio(playUrl);
        activeVoiceAudio.onended = function() {
          if (playUrl.startsWith('blob:')) URL.revokeObjectURL(playUrl);
          if (typeof onEnded === 'function') onEnded();
        };
        activeVoiceAudio.onerror = function(err) {
          console.warn('[LiveVoice] audio error:', err);
          if (playUrl.startsWith('blob:')) URL.revokeObjectURL(playUrl);
          if (typeof onEnded === 'function') onEnded();
        };
        return activeVoiceAudio.play().catch(function(e) {
          console.warn('[LiveVoice] play blocked/rejected:', e);
          if (playUrl.startsWith('blob:')) URL.revokeObjectURL(playUrl);
          if (typeof onEnded === 'function') onEnded();
        });
      };

      window.stopVoiceAudio = globalThis.stopVoiceAudio = function() {
        if (activeVoiceStreamAbort) {
          try { activeVoiceStreamAbort.abort(); } catch(e) {}
          activeVoiceStreamAbort = null;
        }
        liveVoiceAudioQueue = [];
        isPlayingVoiceQueue = false;
        isVoiceStreamDone = false;
        onVoiceStreamAllEndedCb = null;
        if (activeVoiceAudio) {
          try {
            activeVoiceAudio.pause();
            activeVoiceAudio.currentTime = 0;
          } catch(e) {}
          activeVoiceAudio = null;
        }
      };

      window.startLiveVoiceStream = globalThis.startLiveVoiceStream = function(payloadJson, onTextDelta, onFirstAudio, onAllDone, onError) {
        window.stopVoiceAudio();

        activeVoiceStreamAbort = new AbortController();
        isVoiceStreamDone = false;
        onVoiceStreamAllEndedCb = onAllDone;

        fetch('/api/ai/live-stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: payloadJson,
          signal: activeVoiceStreamAbort.signal
        }).then(response => {
          if (!response.ok) {
            throw new Error('HTTP error ' + response.status);
          }
          const reader = response.body.getReader();
          const decoder = new TextDecoder('utf-8');
          let buffer = '';

          function pump() {
            reader.read().then(({ done, value }) => {
              if (done) {
                isVoiceStreamDone = true;
                if (!isPlayingVoiceQueue && liveVoiceAudioQueue.length === 0) {
                  if (typeof onVoiceStreamAllEndedCb === 'function') {
                    const cb = onVoiceStreamAllEndedCb;
                    onVoiceStreamAllEndedCb = null;
                    try { cb(); } catch(e) {}
                  }
                }
                return;
              }

              buffer += decoder.decode(value, { stream: true });
              const blocks = buffer.split('\n\n');
              buffer = blocks.pop(); // incomplete remainder

              for (const block of blocks) {
                if (!block.trim()) continue;
                let eventName = '';
                let dataStr = '';
                for (const line of block.split('\n')) {
                  if (line.startsWith('event: ')) {
                    eventName = line.substring(7).trim();
                  } else if (line.startsWith('data: ')) {
                    dataStr = line.substring(6).trim();
                  }
                }

                if (dataStr) {
                  try {
                    const parsed = JSON.parse(dataStr);
                    if (eventName === 'text' && typeof onTextDelta === 'function') {
                      try { onTextDelta(parsed.delta || '', parsed.accumulated || ''); } catch(e) {}
                    } else if (eventName === 'audio' && parsed.audio) {
                      window.enqueueLiveVoiceAudio(parsed.audio, onFirstAudio, onAllDone);
                    } else if (eventName === 'done') {
                      isVoiceStreamDone = true;
                      if (!isPlayingVoiceQueue && liveVoiceAudioQueue.length === 0) {
                        if (typeof onVoiceStreamAllEndedCb === 'function') {
                          const cb = onVoiceStreamAllEndedCb;
                          onVoiceStreamAllEndedCb = null;
                          try { cb(); } catch(e) {}
                        }
                      }
                    } else if (eventName === 'error' && typeof onError === 'function') {
                      try { onError(parsed.error || 'Stream error'); } catch(e) {}
                    }
                  } catch(e) {}
                }
              }

              pump();
            }).catch(err => {
              if (err.name === 'AbortError') return;
              if (typeof onError === 'function') onError(err.toString());
            });
          }

          pump();
        }).catch(err => {
          if (err.name === 'AbortError') return;
          if (typeof onError === 'function') onError(err.toString());
        });
      };

      window.startLiveSpeechRecognition = globalThis.startLiveSpeechRecognition = function(lang, onTranscript, onStateChange, onError) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          if (typeof onError === 'function') onError('Browser tidak mendukung Speech Recognition.');
          return false;
        }
        if (voiceRecognition) {
          try { voiceRecognition.abort(); } catch(e) {}
        }

        voiceRecognition = new SpeechRecognition();
        voiceRecognition.lang = lang || 'id-ID';
        voiceRecognition.continuous = false;
        voiceRecognition.interimResults = false;
        voiceRecognition.maxAlternatives = 1;

        voiceRecognition.onstart = function() {
          if (typeof onStateChange === 'function') onStateChange('listening');
        };

        voiceRecognition.onresult = function(event) {
          if (event.results && event.results.length > 0) {
            const text = event.results[0][0].transcript;
            if (typeof onTranscript === 'function') onTranscript(text);
          }
        };

        voiceRecognition.onerror = function(event) {
          if (typeof onError === 'function') onError(event.error || 'Speech error');
        };

        voiceRecognition.onend = function() {
          if (typeof onStateChange === 'function') onStateChange('idle');
        };

        try {
          voiceRecognition.start();
          return true;
        } catch(e) {
          if (typeof onError === 'function') onError(e.toString());
          return false;
        }
      };

      window.stopLiveSpeechRecognition = globalThis.stopLiveSpeechRecognition = function() {
        if (voiceRecognition) {
          try { voiceRecognition.stop(); } catch(e) {}
          voiceRecognition = null;
        }
      };
    })();

    // High-Performance Zero-Dependency Web Notification Engine
    (function() {
      let origDocTitle = document.title;
      let titleResetTimeout = null;

      function hasNotificationSupport() {
        return typeof window !== 'undefined' && 'Notification' in window;
      }

      function getNotificationPermission() {
        if (!hasNotificationSupport()) return 'unsupported';
        return Notification.permission; // 'granted', 'denied', or 'default'
      }

      async function requestNotificationPermission() {
        if (!hasNotificationSupport()) return 'unsupported';
        try {
          const res = await Notification.requestPermission();
          return res;
        } catch (e) {
          console.warn('[TradeHeroes Notification] requestPermission error:', e);
          return 'denied';
        }
      }

      function sendNotification(title, body, iconUrl, tag) {
        if (!hasNotificationSupport()) return false;
        if (Notification.permission !== 'granted') return false;

        const options = {
          body: body || '',
          icon: iconUrl || 'favicon.png',
          badge: 'favicon.png',
          tag: tag || 'trade-heroes-daily',
          renotify: true,
          requireInteraction: false
        };

        // 1. Play soft audio chime if audio engine is loaded
        try {
          if (typeof window.playTradeSound === 'function') {
            window.playTradeSound('reward', 0.6);
          }
        } catch (_) {}

        // 2. Pulse document title if page is hidden
        try {
          if (document.hidden) {
            clearTimeout(titleResetTimeout);
            document.title = '🔥 ' + title + ' — Trade Heroes';
            titleResetTimeout = setTimeout(function() {
              document.title = origDocTitle;
            }, 8000);
          }
        } catch (_) {}

        // 3. Try standard W3C Notification constructor
        try {
          const notif = new Notification(title, options);
          notif.onclick = function() {
            try {
              window.focus();
            } catch (_) {}
            try {
              notif.close();
            } catch (_) {}
          };
          return true;
        } catch (err) {
          // Fallback for Android Chrome / Service Worker environments
          if ('serviceWorker' in navigator && navigator.serviceWorker.ready) {
            navigator.serviceWorker.ready.then(function(reg) {
              if (reg && reg.showNotification) {
                reg.showNotification(title, options);
              }
            }).catch(function(swErr) {
              console.warn('[TradeHeroes Notification] SW fallback failed:', swErr);
            });
            return true;
          }
          console.warn('[TradeHeroes Notification] Notification display failed:', err);
          return false;
        }
      }

      window.hasTradeNotificationSupport = globalThis.hasTradeNotificationSupport = hasNotificationSupport;
      window.getTradeNotificationPermission = globalThis.getTradeNotificationPermission = getNotificationPermission;
      window.requestTradeNotificationPermission = globalThis.requestTradeNotificationPermission = requestNotificationPermission;
      window.sendTradeNotification = globalThis.sendTradeNotification = sendNotification;
    })();
  </script>
