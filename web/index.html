<html>
<head>

    href value below to reflect the base path you are serving from.

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Trade Heroes — Belajar Investasi & Trading Saham Jadi Menyenangkan, Terukur, dan Bebas Boncos.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Trade Heroes">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Trade Heroes — Belajar Investasi & Trading Saham</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background-color: #0b0f19; margin: 0; padding: 0;">
  <script>
    // Invalidate old service worker and caches to ensure latest release is loaded
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }

    // High-Performance Zero-Latency Web Audio Engine
    (function() {
      let audioCtx = null;
      let audioMuted = false;
      let bgmAudio = null;

      function getAudioContext() {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            audioCtx = new AudioContext();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      // Auto-unlock Web Audio on any user gesture
      ['click', 'pointerdown', 'keydown', 'touchstart'].forEach(function(evt) {
        window.addEventListener(evt, function() {
          getAudioContext();
        }, { once: false, passive: true });
      });

      const soundBuffers = {};
      let currentTheme = 'default';
      const soundNames = ['click', 'correct', 'wrong', 'reward', 'trade'];

      function getSoundUrl(name, theme) {
        if (!theme || theme === 'default') {
          return '/assets/assets/audio/' + name + '.mp3';
        }
        return '/assets/assets/audio/themes/' + theme + '/' + name + '.mp3';
      }

      function preloadSounds() {
        soundNames.forEach(function(name) {
          const url = getSoundUrl(name, currentTheme);
          fetch(url)
            .then(function(res) { return res.arrayBuffer(); })
            .then(function(buf) {
              const ctx = getAudioContext();
              if (ctx) {
                return ctx.decodeAudioData(buf);
              }
            })
            .then(function(decoded) {
              if (decoded) soundBuffers[name] = decoded;
            })
            .catch(function() {});
        });
      }

      window.addEventListener('load', function() {
        preloadSounds();
        // Pre-cache all theme buffers
        ['default','minimal','arcade','nature','mechanical','bubble'].forEach(preloadThemeBuffers);
      });
      setTimeout(preloadSounds, 300);

      let lastClickTime = 0;

      function playSynthClick(vol) {
        if (audioMuted) return;
        const nowMs = performance.now();
        if (nowMs - lastClickTime < 70) return;
        lastClickTime = nowMs;

        const ctx = getAudioContext();
        if (!ctx) return;
        try {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const now = ctx.currentTime;
          osc.type = 'sine';
          // Soft water droplet / gentle bubble (680Hz -> 320Hz)
          osc.frequency.setValueAtTime(680, now);
          osc.frequency.exponentialRampToValueAtTime(320, now + 0.045);
          gain.gain.setValueAtTime((vol || 0.3) * 0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.055);
        } catch (e) {}
      }

      // Universal click feedback: REMOVED — only meaningful actions get SFX

      function playSoundImpl(name, volume) {
        if (audioMuted) return;
        const ctx = getAudioContext();
        const vol = typeof volume === 'number' ? volume : 0.7;

        // Support "theme/sound" format: e.g. "bubble/click", "arcade/correct"
        let theme = currentTheme;
        let soundName = name;
        if (name.indexOf('/') !== -1) {
          const parts = name.split('/');
          theme = parts[0];
          soundName = parts[1];
        }

        const bufKey = getBufferKey(theme, soundName);

        // Try themed buffer first
        if (themedBuffers[bufKey] && ctx) {
          try {
            const src = ctx.createBufferSource();
            const gain = ctx.createGain();
            src.buffer = themedBuffers[bufKey];
            gain.gain.value = Math.min(vol, 0.6);
            src.connect(gain);
            gain.connect(ctx.destination);
            src.start(0);
            return;
          } catch (e) {}
        }

        // Try legacy default buffer (for backward compat)
        if (soundBuffers[soundName] && ctx) {
          try {
            const src = ctx.createBufferSource();
            const gain = ctx.createGain();
            src.buffer = soundBuffers[soundName];
            gain.gain.value = Math.min(vol, 0.6);
            src.connect(gain);
            gain.connect(ctx.destination);
            src.start(0);
            return;
          } catch (e) {}
        }

        // HTML5 Audio fallback
        try {
          const url = getSoundUrl(soundName, theme);
          const audio = new Audio(url);
          audio.volume = Math.min(0.5, Math.max(0.0, vol));
          audio.play().catch(function() {});
        } catch (e) {}
      }

      let currentBgmTrack = 'default';

      function getBgmUrl(track) {
        if (!track || track === 'default') {
          return '/assets/assets/audio/bgm.mp3';
        }
        return '/assets/assets/audio/bgm/' + track + '.mp3';
      }

      function startBgmImpl(volume) {
        if (audioMuted) return;
        try {
          const url = getBgmUrl(currentBgmTrack);
          if (bgmAudio && bgmAudio._trackUrl !== url) {
            bgmAudio.pause();
            bgmAudio = null;
          }
          if (!bgmAudio) {
            bgmAudio = new Audio(url);
            bgmAudio.loop = true;
            bgmAudio._trackUrl = url;
          }
          bgmAudio.volume = typeof volume === 'number' ? volume : 0.14;
          bgmAudio.play().catch(function() {});
        } catch (e) {}
      }

      function stopBgmImpl() {
        try {
          if (bgmAudio) {
            bgmAudio.pause();
            bgmAudio.currentTime = 0;
          }
        } catch (e) {}
      }

      function setAudioMutedImpl(muted) {
        audioMuted = muted;
        if (muted && bgmAudio) {
          bgmAudio.pause();
        }
      }

      // Theme-keyed buffer cache: { "arcade:click": AudioBuffer, ... }
      const themedBuffers = {};

      function getBufferKey(theme, name) {
        return (theme || 'default') + ':' + name;
      }

      function setAudioThemeImpl(theme) {
        currentTheme = theme || 'default';
        // Preload new theme buffers in background (don't clear old ones)
        preloadThemeBuffers(currentTheme);
      }

      function preloadThemeBuffers(theme) {
        const ctx = getAudioContext();
        if (!ctx) return;
        soundNames.forEach(function(name) {
          const key = getBufferKey(theme, name);
          if (themedBuffers[key]) return; // already cached
          const url = getSoundUrl(name, theme);
          fetch(url)
            .then(function(res) { return res.arrayBuffer(); })
            .then(function(buf) { return ctx.decodeAudioData(buf); })
            .then(function(decoded) { if (decoded) themedBuffers[key] = decoded; })
            .catch(function() {});
        });
      }

      function setBgmTrackImpl(track) {
        currentBgmTrack = track || 'default';
      }

      // Expose globally across window, globalThis and dotted properties
      window.playTradeSound = globalThis.playTradeSound = window['window.playTradeSound'] = playSoundImpl;
      window.startTradeBgm = globalThis.startTradeBgm = window['window.startTradeBgm'] = startBgmImpl;
      window.stopTradeBgm = globalThis.stopTradeBgm = window['window.stopTradeBgm'] = stopBgmImpl;
      window.setTradeAudioMuted = globalThis.setTradeAudioMuted = window['window.setTradeAudioMuted'] = setAudioMutedImpl;
      window.setTradeAudioTheme = globalThis.setTradeAudioTheme = window['window.setTradeAudioTheme'] = setAudioThemeImpl;
      window.setTradeBgmTrack = globalThis.setTradeBgmTrack = window['window.setTradeBgmTrack'] = setBgmTrackImpl;
    })();

    // High-Performance Zero-Dependency Web Notification Engine
    (function() {
      let origDocTitle = document.title;
      let titleResetTimeout = null;

      function hasNotificationSupport() {
        return typeof window !== 'undefined' && 'Notification' in window;
      }

      function getNotificationPermission() {
        if (!hasNotificationSupport()) return 'unsupported';
        return Notification.permission; // 'granted', 'denied', or 'default'
      }

      async function requestNotificationPermission() {
        if (!hasNotificationSupport()) return 'unsupported';
        try {
          const res = await Notification.requestPermission();
          return res;
        } catch (e) {
          console.warn('[TradeHeroes Notification] requestPermission error:', e);
          return 'denied';
        }
      }

      function sendNotification(title, body, iconUrl, tag) {
        if (!hasNotificationSupport()) return false;
        if (Notification.permission !== 'granted') return false;

        const options = {
          body: body || '',
          icon: iconUrl || 'favicon.png',
          badge: 'favicon.png',
          tag: tag || 'trade-heroes-daily',
          renotify: true,
          requireInteraction: false
        };

        // 1. Play soft audio chime if audio engine is loaded
        try {
          if (typeof window.playTradeSound === 'function') {
            window.playTradeSound('reward', 0.6);
          }
        } catch (_) {}

        // 2. Pulse document title if page is hidden
        try {
          if (document.hidden) {
            clearTimeout(titleResetTimeout);
            document.title = '🔥 ' + title + ' — Trade Heroes';
            titleResetTimeout = setTimeout(function() {
              document.title = origDocTitle;
            }, 8000);
          }
        } catch (_) {}

        // 3. Try standard W3C Notification constructor
        try {
          const notif = new Notification(title, options);
          notif.onclick = function() {
            try {
              window.focus();
            } catch (_) {}
            try {
              notif.close();
            } catch (_) {}
          };
          return true;
        } catch (err) {
          // Fallback for Android Chrome / Service Worker environments
          if ('serviceWorker' in navigator && navigator.serviceWorker.ready) {
            navigator.serviceWorker.ready.then(function(reg) {
              if (reg && reg.showNotification) {
                reg.showNotification(title, options);
              }
            }).catch(function(swErr) {
              console.warn('[TradeHeroes Notification] SW fallback failed:', swErr);
            });
            return true;
          }
          console.warn('[TradeHeroes Notification] Notification display failed:', err);
          return false;
        }
      }

      window.hasTradeNotificationSupport = globalThis.hasTradeNotificationSupport = hasNotificationSupport;
      window.getTradeNotificationPermission = globalThis.getTradeNotificationPermission = getNotificationPermission;
      window.requestTradeNotificationPermission = globalThis.requestTradeNotificationPermission = requestNotificationPermission;
      window.sendTradeNotification = globalThis.sendTradeNotification = sendNotification;
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
