<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Trade Heroes — Belajar Investasi & Trading Saham Jadi Menyenangkan, Terukur, dan Bebas Boncos.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Trade Heroes">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Trade Heroes — Belajar Investasi & Trading Saham</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background-color: #0b0f19; margin: 0; padding: 0;">
  <script>
    // Invalidate old service worker and caches to ensure latest release is loaded
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }

    // High-Performance Zero-Latency Web Audio Engine
    (function() {
      let audioCtx = null;
      let audioMuted = false;
      let bgmAudio = null;

      function getAudioContext() {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            audioCtx = new AudioContext();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      // Auto-unlock Web Audio on any user gesture
      ['click', 'pointerdown', 'keydown', 'touchstart'].forEach(function(evt) {
        window.addEventListener(evt, function() {
          getAudioContext();
        }, { once: false, passive: true });
      });

      const soundBuffers = {};
      const soundUrls = {
        click: '/assets/assets/audio/click.mp3',
        correct: '/assets/assets/audio/correct.mp3',
        wrong: '/assets/assets/audio/wrong.mp3',
        reward: '/assets/assets/audio/reward.mp3',
        trade: '/assets/assets/audio/trade.mp3'
      };

      function preloadSounds() {
        for (const name in soundUrls) {
          fetch(soundUrls[name])
            .then(function(res) { return res.arrayBuffer(); })
            .then(function(buf) {
              const ctx = getAudioContext();
              if (ctx) {
                return ctx.decodeAudioData(buf);
              }
            })
            .then(function(decoded) {
              if (decoded) soundBuffers[name] = decoded;
            })
            .catch(function() {});
        }
      }

      window.addEventListener('load', preloadSounds);
      setTimeout(preloadSounds, 300);

      let lastClickTime = 0;

      function playSynthClick(vol) {
        if (audioMuted) return;
        const nowMs = performance.now();
        if (nowMs - lastClickTime < 70) return;
        lastClickTime = nowMs;

        const ctx = getAudioContext();
        if (!ctx) return;
        try {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const now = ctx.currentTime;
          osc.type = 'sine';
          // Soft water droplet / gentle bubble (680Hz -> 320Hz)
          osc.frequency.setValueAtTime(680, now);
          osc.frequency.exponentialRampToValueAtTime(320, now + 0.045);
          gain.gain.setValueAtTime((vol || 0.3) * 0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.055);
        } catch (e) {}
      }

      // Universal click feedback: REMOVED — only meaningful actions get SFX

      function playSoundImpl(name, volume) {
        if (audioMuted) return;
        const ctx = getAudioContext();
        const vol = typeof volume === 'number' ? volume : 0.7;

        if (name === 'click') {
          if (soundBuffers['click'] && ctx) {
            try {
              const src = ctx.createBufferSource();
              const gain = ctx.createGain();
              src.buffer = soundBuffers['click'];
              gain.gain.value = vol;
              src.connect(gain);
              gain.connect(ctx.destination);
              src.start(0);
              return;
            } catch (e) {}
          }
          playSynthClick(vol);
          return;
        }

        if (soundBuffers[name] && ctx) {
          try {
            const src = ctx.createBufferSource();
            const gain = ctx.createGain();
            src.buffer = soundBuffers[name];
            gain.gain.value = vol;
            src.connect(gain);
            gain.connect(ctx.destination);
            src.start(0);
            return;
          } catch (e) {}
        }

        // HTML5 Audio element fallback
        try {
          const audio = new Audio(soundUrls[name] || ('/assets/assets/audio/' + name + '.mp3'));
          audio.volume = Math.min(1.0, Math.max(0.0, vol));
          audio.play().catch(function() {});
        } catch (e) {}
      }

      function startBgmImpl(volume) {
        if (audioMuted) return;
        try {
          if (!bgmAudio) {
            bgmAudio = new Audio('/assets/assets/audio/bgm.mp3');
            bgmAudio.loop = true;
          }
          // Soft ambient volume level (14%)
          bgmAudio.volume = typeof volume === 'number' ? volume : 0.14;
          bgmAudio.play().catch(function() {});
        } catch (e) {}
      }

      function stopBgmImpl() {
        try {
          if (bgmAudio) {
            bgmAudio.pause();
            bgmAudio.currentTime = 0;
          }
        } catch (e) {}
      }

      function setAudioMutedImpl(muted) {
        audioMuted = muted;
        if (muted && bgmAudio) {
          bgmAudio.pause();
        }
      }

      // Expose globally across window, globalThis and dotted properties
      window.playTradeSound = globalThis.playTradeSound = window['window.playTradeSound'] = playSoundImpl;
      window.startTradeBgm = globalThis.startTradeBgm = window['window.startTradeBgm'] = startBgmImpl;
      window.stopTradeBgm = globalThis.stopTradeBgm = window['window.stopTradeBgm'] = stopBgmImpl;
      window.setTradeAudioMuted = globalThis.setTradeAudioMuted = window['window.setTradeAudioMuted'] = setAudioMutedImpl;
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
