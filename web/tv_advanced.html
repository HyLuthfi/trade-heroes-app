<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TradingView Official Advanced Chart</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0f19; }
    #tv-widget-container { width: 100%; height: 100%; }
    .tradingview-widget-container { width: 100%; height: 100%; }
    .tradingview-widget-container__widget { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="tv-widget-container">
    <div class="tradingview-widget-container">
      <div id="tradingview_chart" class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
      <script type="text/javascript">
        const urlParams = new URLSearchParams(window.location.search);
        let ticker = (urlParams.get('ticker') || 'BBCA').toUpperCase().split('_')[0].replace('.JK', '');
        let interval = urlParams.get('interval') || 'D';

        new TradingView.widget({
          "autosize": true,
          "symbol": "IDX:" + ticker,
          "interval": interval,
          "timezone": "Asia/Jakarta",
          "theme": "dark",
          "style": "1",
          "locale": "id",
          "enable_publishing": false,
          "hide_top_toolbar": false,
          "hide_legend": false,
          "save_image": false,
          "container_id": "tradingview_chart",
          "backgroundColor": "#0b0f19",
          "gridColor": "rgba(255, 255, 255, 0.04)",
          "studies": [
            "EMA@tv-basicstudies"
          ],
          "disabled_features": [
            "header_saveload",
            "header_settings",
            "header_fullscreen_button",
            "border_around_the_chart"
          ],
          "enabled_features": [
            "hide_left_toolbar_by_default"
          ]
        });
      </script>
    </div>
  </div>
</body>
</html>
