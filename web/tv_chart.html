<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TradingView Official Chart</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
    }
    #tv-container {
      width: 100%;
      height: 100%;
    }
    .tradingview-widget-container {
      width: 100% !important;
      height: 100% !important;
    }
    .tradingview-widget-container iframe {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
      display: block;
    }
  </style>
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>
  <div id="tv-container">
    <div id="tv_chart_target" class="tradingview-widget-container"></div>
  </div>

  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      let rawTicker = (urlParams.get('ticker') || 'BBCA').toUpperCase().split('_')[0].replace('.JK', '');
      let tf = (urlParams.get('tf') || '1D').toUpperCase();
      let paramInv = urlParams.get('interval');

      // 1D (Daily) is 100% free on BEI/IDX in TradingView.
      // Intraday (1m, 5m, 15m) requires paid real-time subscription.
      // Direct initial load must ALWAYS be 'D' (1D)!
      function getInterval(timeframe, explicitInterval) {
        if (explicitInterval && (explicitInterval === 'D' || explicitInterval === 'W' || explicitInterval === 'M')) {
          return explicitInterval;
        }
        if (timeframe === '1W') return 'W';
        if (timeframe === '1M') return 'M';
        return 'D'; // Default directly to 'D' (1D - Daily)
      }

      let interval = getInterval(tf, paramInv);

      function renderWidget(ticker, inv) {
        const container = document.getElementById('tv_chart_target');
        container.innerHTML = '';

        if (typeof TradingView !== 'undefined' && TradingView.widget) {
          new TradingView.widget({
            "autosize": true,
            "symbol": "IDX:" + ticker,
            "interval": inv,
            "timezone": "Asia/Jakarta",
            "theme": "dark",
            "style": "1",
            "locale": "id",
            "toolbar_bg": "#0b0f19",
            "enable_publishing": false,
            "withdateranges": true,
            "hide_side_toolbar": false,
            "allow_symbol_change": true,
            "details": false,
            "hotlist": false,
            "calendar": true,
            "studies": [
              "STD;EMA"
            ],
            "container_id": "tv_chart_target"
          });
        } else {
          // Direct fallback iframe if tv.js is delayed
          const params = new URLSearchParams({
            'frameElementId': 'tradingview_widget',
            'symbol': 'IDX:' + ticker,
            'interval': inv,
            'symboledit': '1',
            'saveimage': '0',
            'toolbarbg': '0b0f19',
            'studies': JSON.stringify(['STD;EMA']),
            'theme': 'dark',
            'style': '1',
            'timezone': 'Asia/Jakarta',
            'withdateranges': '1',
            'hide_side_toolbar': '0',
            'allow_symbol_change': '1',
            'calendar': '1',
            'locale': 'id'
          });
          const ifr = document.createElement('iframe');
          ifr.src = 'https://s.tradingview.com/widgetembed/?' + params.toString();
          ifr.style.width = '100%';
          ifr.style.height = '100%';
          ifr.style.border = 'none';
          ifr.allowTransparency = 'true';
          container.appendChild(ifr);
        }
      }

      renderWidget(rawTicker, interval);

      // Listen for postMessage from Flutter app
      window.addEventListener('message', function(event) {
        try {
          const msg = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
          if (!msg || !msg.action) return;

          if (msg.action === 'loadStock') {
            const nextTicker = (msg.ticker || rawTicker).toUpperCase().split('_')[0].replace('.JK', '');
            const nextTf = (msg.timeframe || tf).toUpperCase();
            const nextInv = getInterval(nextTf, msg.interval);

            rawTicker = nextTicker;
            tf = nextTf;
            renderWidget(nextTicker, nextInv);
          }
        } catch (e) {
          console.error('Error handling message:', e);
        }
      });
    })();
  </script>
</body>
</html>
