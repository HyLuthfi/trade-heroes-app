<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TradingView Official Chart</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
    }
    #tv-container {
      width: 100%;
      height: 100%;
    }
    .tradingview-widget-container {
      width: 100% !important;
      height: 100% !important;
    }
    .tradingview-widget-container iframe {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
      display: block;
    }
  </style>
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>
  <div id="tv-container">
    <div id="tv_chart_target" class="tradingview-widget-container"></div>
  </div>

  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      let rawTicker = (urlParams.get('ticker') || 'BBCA').toUpperCase().split('_')[0].replace('.JK', '');
      let tf = (urlParams.get('tf') || '1D').toUpperCase();
      let paramInv = urlParams.get('interval');

      // 1D (Daily) and higher intervals are 100% free on BEI/IDX in TradingView.
      // Intraday (1m, 5m, 15m) requires a paid real-time subscription.
      // Map timeframe buttons to free, high-quality resolutions:
      function getChartConfig(timeframe, explicitInterval) {
        if (explicitInterval && explicitInterval !== 'D') {
          return { interval: explicitInterval, range: '' };
        }

        const t = (timeframe || '1D').toUpperCase();
        if (t === '1W') {
          // 1 Minggu: lilin mingguan (Weekly)
          return { interval: 'W', range: '12M' };
        } else if (t === '1M') {
          // 1 Bulan: lilin bulanan (Monthly)
          return { interval: 'M', range: '60M' };
        } else if (t === '3M') {
          // 3 Bulan: lilin harian dengan rentang 3 bulan
          return { interval: 'D', range: '3M' };
        } else if (t === '1Y') {
          // 1 Tahun: lilin mingguan dengan rentang 1 tahun
          return { interval: 'W', range: '12M' };
        } else {
          // 1D (Harian): lilin harian (Daily) 100% GRATIS
          return { interval: 'D', range: '3M' };
        }
      }

      function renderWidget(ticker, cfg) {
        const container = document.getElementById('tv_chart_target');
        container.innerHTML = '';

        if (typeof TradingView !== 'undefined' && TradingView.widget) {
          const opts = {
            "autosize": true,
            "symbol": "IDX:" + ticker,
            "interval": cfg.interval,
            "timezone": "Asia/Jakarta",
            "theme": "dark",
            "style": "1",
            "locale": "id",
            "toolbar_bg": "#0b0f19",
            "enable_publishing": false,
            "withdateranges": true,
            "hide_side_toolbar": false,
            "allow_symbol_change": true,
            "details": false,
            "hotlist": false,
            "calendar": true,
            "studies": [
              "STD;EMA"
            ],
            "container_id": "tv_chart_target"
          };
          if (cfg.range) {
            opts.range = cfg.range;
          }
          new TradingView.widget(opts);
        } else {
          // Direct fallback iframe if tv.js is delayed
          const params = new URLSearchParams({
            'frameElementId': 'tradingview_widget',
            'symbol': 'IDX:' + ticker,
            'interval': cfg.interval,
            'symboledit': '1',
            'saveimage': '0',
            'toolbarbg': '0b0f19',
            'studies': JSON.stringify(['STD;EMA']),
            'theme': 'dark',
            'style': '1',
            'timezone': 'Asia/Jakarta',
            'withdateranges': '1',
            'hide_side_toolbar': '0',
            'allow_symbol_change': '1',
            'calendar': '1',
            'locale': 'id'
          });
          if (cfg.range) {
            params.set('range', cfg.range);
          }
          const ifr = document.createElement('iframe');
          ifr.src = 'https://s.tradingview.com/widgetembed/?' + params.toString();
          ifr.style.width = '100%';
          ifr.style.height = '100%';
          ifr.style.border = 'none';
          ifr.allowTransparency = 'true';
          container.appendChild(ifr);
        }
      }

      const initialCfg = getChartConfig(tf, paramInv);
      renderWidget(rawTicker, initialCfg);

      // Listen for postMessage from Flutter app
      window.addEventListener('message', function(event) {
        try {
          const msg = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
          if (!msg || !msg.action) return;

          if (msg.action === 'loadStock' || msg.action === 'changeTimeframe') {
            const nextTicker = (msg.ticker || rawTicker).toUpperCase().split('_')[0].replace('.JK', '');
            const nextTf = (msg.timeframe || tf).toUpperCase();
            const nextCfg = getChartConfig(nextTf, msg.interval);

            rawTicker = nextTicker;
            tf = nextTf;
            renderWidget(nextTicker, nextCfg);
          }
        } catch (e) {
          console.error('Error handling message:', e);
        }
      });
    })();
  </script>
</body>
</html>
